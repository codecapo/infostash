version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised one is
    # usually caught and yanked first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      # Arrow, Parquet, DataFusion and Iceberg must move together.
      arrow-stack:
        patterns: ["arrow*", "parquet", "datafusion*", "iceberg*"]
      other:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised one is
    # usually caught and yanked first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
