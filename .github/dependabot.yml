version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      # Arrow, Parquet, DataFusion and Iceberg must move together.
      arrow-stack:
        patterns: ["arrow*", "parquet", "datafusion*", "iceberg*"]
      other:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
