# cargo-deny: licenses, security advisories, banned and unknown sources.
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
yanked = "deny"
# zstd 0.13 is required by arrow-ipc and apache-avro; the fixes are in 0.14.
# Remove these once arrow and iceberg move to zstd 0.14.
ignore = [
  { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 pinned by arrow and avro" },
  { id = "RUSTSEC-2026-0398", reason = "zstd 0.13 pinned by arrow and avro" },
  { id = "RUSTSEC-2026-0403", reason = "zstd 0.13 pinned by arrow and avro" },
  # SQLite before 3.54 (libsqlite3-sys 0.30, through sqlx 0.8 and
  # iceberg-catalog-sql) can return uninitialised memory when a database is
  # opened next to a crafted -wal file. Only catalog.db in the warehouse
  # directory is opened through it, and Infostash is the only writer there.
  # No sqlx release accepts the fixed libsqlite3-sys 0.39 yet; remove this
  # once one does and iceberg-rust uses it.
  { id = "RUSTSEC-2026-0459", reason = "SQLite 3.46 pinned by sqlx 0.8 through iceberg-catalog-sql" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "allow"
# Git dependencies count as wildcards; deny again once iceberg is released.
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Unreleased iceberg-rust; see the comment in Cargo.toml.
allow-git = [
  "https://github.com/apache/iceberg-rust",
  "https://github.com/apache/datafusion-iceberg",
]
