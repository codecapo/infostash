[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/codecapo/infostash"

[workspace.dependencies]
infostash-model = { path = "crates/model", version = "0.1.0" }
infostash-compiler = { path = "crates/compiler", version = "0.1.0" }
infostash-engine = { path = "crates/engine", version = "0.1.0" }
infostash-dist = { path = "crates/dist", version = "0.1.0" }
infostash-storage = { path = "crates/storage", version = "0.1.0" }
infostash-connectors = { path = "crates/connectors", version = "0.1.0" }
infostash-jobs = { path = "crates/jobs", version = "0.1.0" }
infostash-server = { path = "crates/server", version = "0.1.0" }
infostash-agent = { path = "crates/agent", version = "0.1.0" }
# Unreleased iceberg-rust, for DataFusion 55 (apache/iceberg-rust#3290).
# The DataFusion integration moved to apache/datafusion-iceberg; keep the
# iceberg rev equal to the one that repo pins, or two iceberg copies build.
# Arrow and parquet must match iceberg's.
arrow-array = "59.2"
arrow-csv = "59.2"
arrow-json = "59.2"
arrow-schema = "59.2"
datafusion = "55.2.0"
iceberg = { git = "https://github.com/apache/iceberg-rust", rev = "5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3" }
iceberg-catalog-sql = { git = "https://github.com/apache/iceberg-rust", rev = "5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3" }
iceberg-datafusion = { git = "https://github.com/apache/datafusion-iceberg", rev = "7fb643f850e23e2764f742cf84088a5b7c07d33c" }
parquet = "59.2"


[workspace.lints.rust]
unsafe_code = "forbid"

# CI runs clippy with -D warnings, so these fail the build. Tests may still
# unwrap (see clippy.toml); library code returns errors instead of panicking.
[workspace.lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
