[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/infostash/infostash"

[workspace.dependencies]
infostash-model = { path = "crates/model" }
infostash-compiler = { path = "crates/compiler" }
infostash-engine = { path = "crates/engine" }
infostash-dist = { path = "crates/dist" }
infostash-storage = { path = "crates/storage" }
infostash-connectors = { path = "crates/connectors" }
infostash-jobs = { path = "crates/jobs" }
infostash-server = { path = "crates/server" }
infostash-agent = { path = "crates/agent" }
# Unreleased iceberg-rust, for DataFusion 55 (apache/iceberg-rust#3290).
# The DataFusion integration moved to apache/datafusion-iceberg; keep the
# iceberg rev equal to the one that repo pins, or two iceberg copies build.
# Arrow and parquet must match iceberg's.
arrow-array = "59.2"
arrow-schema = "59.2"
datafusion = "55.2.0"
iceberg = { git = "https://github.com/apache/iceberg-rust", rev = "5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3" }
iceberg-datafusion = { git = "https://github.com/apache/datafusion-iceberg", rev = "7fb643f850e23e2764f742cf84088a5b7c07d33c" }
parquet = "59.2"

