[package]
name = "infostash-cli"
description = "The infoctl command line"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arrow-csv.workspace = true
arrow-json.workspace = true
datafusion.workspace = true
infostash-engine.workspace = true
infostash-storage.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[dev-dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
infostash-model.workspace = true
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "infoctl"
path = "src/main.rs"

[lints]
workspace = true
