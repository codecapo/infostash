[package]
name = "infostash-storage"
description = "Object storage and Iceberg table access"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arrow-array = "58"
arrow-schema = "58"
futures = "0.3.34"
iceberg = "0.10.1"
infostash-model.workspace = true
parquet = "58"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
