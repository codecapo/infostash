[package]
name = "infostash-storage"
description = "Object storage and Iceberg table access"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
futures = "0.3.34"
iceberg.workspace = true
iceberg-catalog-sql.workspace = true
infostash-model.workspace = true
parquet.workspace = true
# The SQL catalog reaches databases through sqlx; this turns on its SQLite
# driver so the catalog can live in one file next to the tables.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
